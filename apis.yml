name: Open Souls
description: >-
  Open Souls is an open-source framework and philosophy for building "AI souls" —
  agentic, embodied digital beings with personality, drive, and ego, built on top
  of large language models. The Soul Engine framework (distributed as the
  soul-engine npm package and CLI) models agency, memory, emotion, and goal-setting
  through WorkingMemory, cognitiveSteps, and MentalProcesses abstractions,
  describing itself as "NextJS + Vercel for the minds of digital beings." The
  project is now legacy: the opensouls.org site is parked and the hosted Soul
  Engine cloud service is no longer operating, but the open-source framework and
  npm packages remain published under the opensouls GitHub organization. Open Souls
  was surfaced as a portfolio company of a16z and added to the API Evangelist
  network.
